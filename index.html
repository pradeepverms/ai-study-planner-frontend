<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Study Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      background: #020617;
      padding: 30px;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
      color: #38bdf8;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: none;
      font-size: 16px;
    }

    button {
      background: #38bdf8;
      color: #020617;
      cursor: pointer;
      margin-top: 20px;
      font-weight: bold;
    }

    button:hover {
      background: #0ea5e9;
    }

    pre {
      background: #020617;
      border: 1px solid #334155;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      margin-top: 20px;
    }

    .error {
      color: #f87171;
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>AI Study Planner</h1>

    <label>Exam Name</label>
    <input id="exam" placeholder="GATE DA" />

    <label>Exam Date</label>
    <input id="exam_date" type="date" />

    <label>Daily Study Hours</label>
    <input id="hours" type="number" value="5" />

    <label>Level</label>
    <select id="level">
      <option value="beginner">Beginner</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select>

    <button onclick="generatePlan()">Generate Study Plan</button>

    <div id="error" class="error"></div>
    <pre id="result"></pre>
  </div>

  <script>
    const API_BASE = "https://ai-study-planner-backend-2.onrender.com";

    async function generatePlan() {
      document.getElementById("error").innerText = "";
      document.getElementById("result").innerText = "Generating plan...";

      const data = {
        exam: document.getElementById("exam").value,
        exam_date: document.getElementById("exam_date").value,
        daily_hours: Number(document.getElementById("hours").value),
        level: document.getElementById("level").value
      };

      try {
        const response = await fetch(`${API_BASE}/api/v1/generate-plan`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          throw new Error("Backend error: " + response.status);
        }

        const result = await response.json();
        document.getElementById("result").innerText =
          JSON.stringify(result, null, 2);

      } catch (err) {
        document.getElementById("result").innerText = "";
        document.getElementById("error").innerText =
          "❌ Cannot reach backend. Check API URL or CORS.";
        console.error(err);
      }
    }
  </script>
</body>
</html>
