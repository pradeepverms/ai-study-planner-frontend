<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Study Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      background: #0f172a;
      font-family: Arial, sans-serif;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: #020617;
      padding: 30px;
      border-radius: 10px;
    }
    h1 {
      text-align: center;
      color: #22d3ee;
      margin-bottom: 20px;
    }
    label {
      margin-top: 10px;
      display: block;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #020617;
      color: #e5e7eb;
    }
    button {
      background: #22d3ee;
      color: #020617;
      font-weight: bold;
      cursor: pointer;
    }
    pre {
      background: #020617;
      padding: 10px;
      border: 1px solid #334155;
      border-radius: 6px;
      white-space: pre-wrap;
    }
    .error {
      color: #f87171;
      font-weight: bold;
    }
  </style>
</head>

<body>
<div class="container">
  <h1>AI Study Planner</h1>

  <label>Exam Name</label>
  <input id="examName" value="GATE DA" />

  <label>Exam Date</label>
  <input id="examDate" type="date" />

  <label>Daily Study Hours</label>
  <input id="hours" type="number" value="5" />

  <label>Level</label>
  <select id="level">
    <option value="beginner">Beginner</option>
    <option value="intermediate">Intermediate</option>
    <option value="advanced">Advanced</option>
  </select>

  <button onclick="generatePlan()">Generate Study Plan</button>

  <div id="output"></div>
</div>

<script>
const BACKEND = "https://ai-study-planner-backend-2.onrender.com";

async function generatePlan() {
  const output = document.getElementById("output");
  output.innerHTML = "Loading...";

  const payload = {
    exam_name: document.getElementById("examName").value,
    exam_date: document.getElementById("examDate").value,
    daily_study_hours: Number(document.getElementById("hours").value),
    level: document.getElementById("level").value
  };

  try {
    const res = await fetch(`${BACKEND}/api/v1/generate-plan`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(JSON.stringify(data, null, 2));
    }

    output.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;

  } catch (err) {
    output.innerHTML = `<div class="error">Backend Error:<pre>${err.message}</pre></div>`;
  }
}
</script>
</body>
</html>
