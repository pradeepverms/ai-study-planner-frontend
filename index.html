<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Study Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #111;
      padding: 30px;
      border-radius: 10px;
      width: 420px;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #4ef0d4;
    }

    label {
      display: block;
      margin-top: 15px;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: none;
      outline: none;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      background: #4ef0d4;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #3bd1b8;
    }

    pre {
      margin-top: 20px;
      background: #000;
      padding: 15px;
      border-radius: 5px;
      max-height: 300px;
      overflow: auto;
      font-size: 12px;
    }

    .error {
      color: #ff6b6b;
      margin-top: 15px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>AI Study Planner</h1>

    <label>Exam Name</label>
    <input id="exam" value="GATE DA" />

    <label>Exam Date</label>
    <input id="exam_date" type="date" value="2028-03-05" />

    <label>Daily Study Hours</label>
    <input id="daily_hours" type="number" value="5" />

    <label>Level</label>
    <select id="level">
      <option value="beginner">Beginner</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select>

    <button onclick="generatePlan()">Generate Study Plan</button>

    <div id="error" class="error"></div>
    <pre id="result"></pre>
  </div>

  <script>
    async function generatePlan() {
      const payload = {
        exam: document.getElementById("exam").value,
        exam_date: document.getElementById("exam_date").value,
        daily_hours: Number(document.getElementById("daily_hours").value),
        level: document.getElementById("level").value,
        topics: []
      };

      document.getElementById("error").innerText = "";
      document.getElementById("result").innerText = "";

      try {
        const res = await fetch(
          "https://ai-study-planner-backend-2.onrender.com/generate-plan/",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          }
        );

        const data = await res.json();

        if (!res.ok) throw data;

        document.getElementById("result").innerText =
          JSON.stringify(data, null, 2);

      } catch (err) {
        document.getElementById("error").innerText =
          "Backend Error:\n" + JSON.stringify(err, null, 2);
      }
    }
  </script>

</body>
</html>
