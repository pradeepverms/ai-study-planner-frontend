<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Study Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #0f766e, #020617);
      font-family: Arial, sans-serif;
      color: #e5e7eb;
    }

    .card {
      background: #020617;
      padding: 28px;
      width: 420px;
      border-radius: 14px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    }

    h1 {
      text-align: center;
      color: #5eead4;
      margin-bottom: 22px;
    }

    label {
      font-size: 14px;
      margin-top: 14px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #020617;
      color: #e5e7eb;
      font-size: 14px;
    }

    button {
      margin-top: 22px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #5eead4, #22d3ee);
      color: #020617;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      opacity: 0.9;
    }

    pre {
      margin-top: 18px;
      background: #020617;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 10px;
      max-height: 260px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 13px;
    }

    .error {
      color: #f87171;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>AI Study Planner</h1>

    <label>Exam</label>
    <input id="exam" value="GATE DA" />

    <label>Exam Date</label>
    <input id="examDate" type="date" />

    <label>Daily Study Hours</label>
    <input id="dailyHours" type="number" value="5" />

    <label>Level</label>
    <select id="level">
      <option value="beginner">Beginner</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select>

    <label>Topics (comma separated)</label>
    <input id="topics" placeholder="Maths, Programming, ML" />

    <button onclick="generatePlan()">Generate Study Plan</button>

    <pre id="output"></pre>
  </div>

  <script>
    const API_URL = "https://ai-study-planner-backend-2.onrender.com/api/v1/generate-plan";

    async function generatePlan() {
      const output = document.getElementById("output");
      output.textContent = "Generating plan...";

      const payload = {
        exam: document.getElementById("exam").value,
        exam_date: document.getElementById("examDate").value,
        daily_hours: Number(document.getElementById("dailyHours").value),
        level: document.getElementById("level").value,
        topics: document.getElementById("topics").value
          .split(",")
          .map(t => t.trim())
          .filter(Boolean)
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          output.innerHTML = '<span class="error">' + JSON.stringify(data, null, 2) + '</span>';
          return;
        }

        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.innerHTML = '<span class="error">' + err.message + '</span>';
      }
    }
  </script>
</body>
</html>
